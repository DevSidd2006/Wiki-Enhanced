<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest World News</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .news-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .news-filters {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px var(--shadow-color);
    }
    
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .news-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow-color);
    }
    
    .news-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f0f0f0;
    }
    
    .news-content {
      padding: 20px;
    }
    
    .news-title {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    
    .news-title a {
      color: inherit;
      text-decoration: none;
    }
    
    .news-title a:hover {
      text-decoration: underline;
    }
    
    .news-description {
      color: var(--text-color);
      line-height: 1.5;
      margin-bottom: 15px;
    }
    
    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      color: #666;
    }
    
    .news-source {
      font-weight: 500;
    }
    
    .loading-spinner {
      text-align: center;
      padding: 40px;
      font-size: 1.2em;
      color: #666;
    }
    
    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
      text-align: center;
    }
    
    .filter-group {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .filter-group label {
      font-weight: 600;
      color: var(--text-color);
    }
    
    .filter-group select {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text-color);
      min-width: 150px;
    }
    
    .refresh-btn {
      padding: 8px 16px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .refresh-btn:hover {
      background: var(--primary-hover);
    }
    
    .refresh-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    @media (max-width: 768px) {
      .news-page {
        padding: 10px;
      }
      
      .filter-group {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-group select {
        min-width: auto;
      }
      
      .news-grid {
        grid-template-columns: 1fr;
      }
      
      .news-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="index.html" class="logo">📰 World News</a>
        <a href="index.html" class="back-button">← Back to Main</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <div class="news-page">
    <div class="welcome-section">
      <h1>📰 Latest World News</h1>
      <p class="subtitle">Stay updated with breaking news from around the globe</p>
    </div>

    <div class="news-filters">
      <h3>🔍 Filter News</h3>
      <div class="filter-group">
        <div>
          <label for="newsCategory">Category:</label>
          <select id="newsCategory">
            <option value="general">General</option>
            <option value="world">World</option>
            <option value="business">Business</option>
            <option value="technology">Technology</option>
            <option value="science">Science</option>
            <option value="health">Health</option>
            <option value="sports">Sports</option>
            <option value="entertainment">Entertainment</option>
          </select>
        </div>
        
        <div>
          <label for="newsCountry">Country:</label>
          <select id="newsCountry">
            <option value="us">🇺🇸 United States</option>
            <option value="gb">🇬🇧 United Kingdom</option>
            <option value="ca">🇨🇦 Canada</option>
            <option value="au">🇦🇺 Australia</option>
            <option value="de">🇩🇪 Germany</option>
            <option value="fr">🇫🇷 France</option>
            <option value="jp">🇯🇵 Japan</option>
            <option value="in">🇮🇳 India</option>
            <option value="br">🇧🇷 Brazil</option>
            <option value="mx">🇲🇽 Mexico</option>
            <option value="it">🇮🇹 Italy</option>
            <option value="es">🇪🇸 Spain</option>
          </select>
        </div>
        
        <div>
          <label for="newsCount">Articles:</label>
          <select id="newsCount">
            <option value="6">6 Articles</option>
            <option value="12" selected>12 Articles</option>
            <option value="20">20 Articles</option>
            <option value="30">30 Articles</option>
          </select>
        </div>
        
        <button id="refreshBtn" class="refresh-btn" onclick="loadNews()">
          🔄 Refresh News
        </button>
      </div>
    </div>

    <div id="newsContainer" class="news-grid">
      <div class="loading-spinner">
        📰 Loading latest news...
      </div>
    </div>

    <div id="lastUpdated" style="text-align: center; color: #666; margin-top: 20px; font-size: 0.9em;">
      <!-- Last updated time will be shown here -->
    </div>
  </div>

  <script>
    let isLoading = false;

    async function loadNews() {
      if (isLoading) return;
      
      const container = document.getElementById('newsContainer');
      const refreshBtn = document.getElementById('refreshBtn');
      const category = document.getElementById('newsCategory').value;
      const country = document.getElementById('newsCountry').value;
      const pageSize = document.getElementById('newsCount').value;
      
      isLoading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = '⏳ Loading...';
      
      container.innerHTML = `
        <div class="loading-spinner">
          📰 Loading latest news...
        </div>
      `;

      try {
        const response = await fetch(`/api/news?category=${category}&country=${country}&pageSize=${pageSize}`);
        const data = await response.json();
        
        if (!data.articles || data.articles.length === 0) {
          container.innerHTML = `
            <div class="error-message">
              📰 No news articles available for the selected filters.
            </div>
          `;
          return;
        }

        // Create news cards
        let newsHtml = '';
        data.articles.forEach(article => {
          const timeAgo = getTimeAgo(new Date(article.publishedAt));
          
          newsHtml += `
            <div class="news-card">
              ${article.urlToImage ? 
                `<img src="${article.urlToImage}" alt="News image" class="news-image" onerror="this.style.display='none'">` : 
                `<div class="news-image" style="display: flex; align-items: center; justify-content: center; background: #f0f0f0; color: #999;">📰 No Image</div>`
              }
              <div class="news-content">
                <h3 class="news-title">
                  ${article.url !== '#' ? 
                    `<a href="${article.url}" target="_blank">${article.title}</a>` : 
                    article.title
                  }
                </h3>
                <p class="news-description">
                  ${article.description || 'No description available.'}
                </p>
                <div class="news-meta">
                  <div class="news-source">${article.source}</div>
                  <div class="news-time">${timeAgo}</div>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = newsHtml;
        
        // Update last updated time
        const lastUpdated = document.getElementById('lastUpdated');
        lastUpdated.innerHTML = `
          Last updated: ${new Date().toLocaleString()}
          ${data.source === 'mock' ? '<br><span style="color: #ff9800;">📝 Demo data - Configure NEWS_API_KEY for real-time news</span>' : ''}
        `;
        
      } catch (error) {
        console.error('Error loading news:', error);
        container.innerHTML = `
          <div class="error-message">
            ❌ Failed to load news. Please check your connection and try again.
          </div>
        `;
      } finally {
        isLoading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = '🔄 Refresh News';
      }
    }

    function getTimeAgo(date) {
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);
      
      if (diffInSeconds < 60) return 'Just now';
      if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
      if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
      if (diffInSeconds < 604800) return `${Math.floor(diffInSeconds / 86400)}d ago`;
      
      return date.toLocaleDateString();
    }

    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      const themeToggle = document.querySelector('.theme-toggle');
      themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }

    // Initialize theme
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      
      const themeToggle = document.querySelector('.theme-toggle');
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      
      // Load news
      loadNews();
      
      // Auto-refresh every 15 minutes
      setInterval(loadNews, 900000);
      
      // Add event listeners for filters
      document.getElementById('newsCategory').addEventListener('change', loadNews);
      document.getElementById('newsCountry').addEventListener('change', loadNews);
      document.getElementById('newsCount').addEventListener('change', loadNews);
    });

    // Handle keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' && e.ctrlKey) {
        e.preventDefault();
        loadNews();
      }
    });
  </script>
</body>
</html>
