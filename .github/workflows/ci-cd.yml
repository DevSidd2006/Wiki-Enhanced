# CI/CD Pipeline for Wiki Enhanced
# 
# Required GitHub Secrets:
# - OPENROUTER_API_KEY: Your OpenRouter API key
# - NEWS_API_KEY: Your NewsAPI key  
# - VERCEL_TOKEN: Your Vercel deployment token
# - ORG_ID: Your Vercel organization ID
# - PROJECT_ID: Your Vercel project ID

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for security vulnerabilities
      run: npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Run tests
      run: npm test --if-present
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
    
    - name: Run linter
      run: npm run lint --if-present
    
    - name: Check build
      run: npm run build --if-present

  deploy:
    needs: [test, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build --if-present
    
    - name: Deploy to Vercel
      id: deploy
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--prod'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
    
    - name: Comment deployment URL
      if: success()
      run: echo "🚀 Deployment successful! URL:" ${{ steps.deploy.outputs.preview-url }}

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check code formatting
      run: npx prettier --check . || echo "Code formatting check completed"
      continue-on-error: true
    
    - name: Check for unused dependencies
      run: npx depcheck || echo "Dependency check completed"
      continue-on-error: true
